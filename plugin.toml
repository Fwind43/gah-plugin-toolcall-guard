name = "toolcall-guard"
version = "0.2.0"
category = "extension"
entry = "main:apply"
description = "Detect plain-text/XML/DSML/token-leaked tool calls when no structured tool call was emitted, sanitize polluted history, and prompt the model to regenerate."
description_zh = "当模型在正文中以纯文本/XML/DSML/控制标记形式伪造工具调用而未触发结构化工具调用时自动拦截、清理污染上下文并要求重新生成。"
inject = ["ga.agent", "ga.hooks?"]
provides = []

[settings.max_retries]
type = "integer"
default = 3
min = 0
max = 10
label = "Max consecutive retries"
label_zh = "最大连续重试次数"
description = "Maximum consecutive regeneration prompts when the model keeps outputting plain-text tool calls on the same step (0 disables interception)."
description_zh = "同一执行步连续检测到纯文本伪工具调用时的最大重试提示次数（设为 0 则禁用拦截）。"

[settings.sanitize_history]
type = "boolean"
default = true
label = "Sanitize polluted assistant history"
label_zh = "清理污染的助手上下文"
description = "Strip the leaked plain-text tool call tail from the assistant's recorded message before retrying so the model does not imitate its own broken format."
description_zh = "触发重试前从当前轮助手历史消息中剥离混入正文的伪工具调用片段（保留 thinking 签名与 summary），避免长上下文自模仿复发。"

[settings.extra_markers]
type = "string"
default = ""
max_length = 2000
label = "Extra trigger markers (comma-separated)"
label_zh = "额外触发特征词（逗号分隔）"
description = "Optional custom substrings (e.g. '<my_tool_tag>,[CALL_TOOL]') that should also be treated as plain-text tool calls."
description_zh = "可选的自定义子串（用英文逗号分隔，如 '<my_tool_tag>,[CALL_TOOL]'），命中时同样视为纯文本工具调用。"
